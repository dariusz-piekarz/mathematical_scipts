name: Functional analysis - chapter 20 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/functional_analysis/20-*.tex'
      - 'tools/tests/test_functional_analysis_ch20.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check chapter 20 derivative and jump regressions
        run: python3 tools/tests/test_functional_analysis_ch20.py
      - name: Prepare TeX wrapper with complete reference context 01-20 (including 15A/15B)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          book = Path('books/pl/functional_analysis.tex').read_text(encoding='utf-8')
          assert book.count(r'\begin{document}') == 1
          pre = book.split(r'\begin{document}', 1)[0]
          inputs = re.findall(
              r'\\input\{(\.\./\.\./chapters/pl/functional_analysis/[^}]+)\}',
              book
          )
          assert len(inputs) >= 22
          assert all(inputs[i].split('/')[-1].startswith(f'{i+1:02d}-')
                     for i in range(15))
          assert inputs[15].split('/')[-1].startswith('15A-')
          assert inputs[16].split('/')[-1].startswith('15B-')
          assert inputs[17].split('/')[-1].startswith('16-')
          assert inputs[18].split('/')[-1].startswith('17-')
          assert inputs[19].split('/')[-1].startswith('18-')
          assert inputs[20].split('/')[-1].startswith('19-')
          assert inputs[21].split('/')[-1].startswith('20-')
          body = r'\begin{document}' + '\n'
          body += '\n'.join(r'\input{' + name + '}' for name in inputs[:22])
          body += '\n' + r'\end{document}' + '\n'
          Path('books/pl/functional_analysis_ch20_context_ci.tex').write_text(
              pre + body, encoding='utf-8'
          )
          PY
      - name: Compile chapter 20 with complete 01-20 reference context
        uses: xu-cheng/latex-action@v3
        with:
          root_file: functional_analysis_ch20_context_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify PDF, chapter heading, mathematical content and cross-references
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          test -s books/pl/functional_analysis_ch20_context_ci.pdf
          test -s books/pl/functional_analysis_ch20_context_ci.log
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' books/pl/functional_analysis_ch20_context_ci.log; then
            echo 'Chapter 20 LaTeX diagnostics failed.'
            exit 1
          fi
          pdfinfo books/pl/functional_analysis_ch20_context_ci.pdf
          pdftotext -layout books/pl/functional_analysis_ch20_context_ci.pdf books/pl/functional_analysis_ch20_context_ci.txt
          grep -q 'Pochodne dystrybucyjne i transpozycja operatorów' books/pl/functional_analysis_ch20_context_ci.txt
          grep -q 'Pochodna funkcji ze skokiem' books/pl/functional_analysis_ch20_context_ci.txt
          grep -q 'Znikanie gradientu na zbiorze spójnym' books/pl/functional_analysis_ch20_context_ci.txt
      - name: Upload PDF and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-analysis-ch20-pdf
          path: |
            books/pl/functional_analysis_ch20_context_ci.pdf
            books/pl/functional_analysis_ch20_context_ci.log
            books/pl/functional_analysis_ch20_context_ci.txt
          if-no-files-found: warn
