name: PDE - chapter 04 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/partial_differential_equations/04-rownanie-ciepla.tex'
      - 'chapters/pl/partial_differential_equations/03-rownania-laplace-a-i-poissona.tex'
      - 'books/pl/partial_differential_equations.tex'
      - 'catalog/partial_differential_equations_manifest.json'
      - 'latex/pl/code-listings.tex'
      - 'application/config/preambles/PDE.tex'
      - 'tests/mathematical/partial_differential_equations/chapter-04/**'
      - '.github/workflows/partial-differential-equations-ch04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch04:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run executable regression checks
        run: python3 tests/mathematical/partial_differential_equations/chapter-04/test_heat.py -v
      - name: Check references and prepare standalone chapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          chapter = Path("chapters/pl/partial_differential_equations/04-rownanie-ciepla.tex")
          source = chapter.read_text(encoding="utf-8")
          labels = re.findall(r"\\label\{([^}]+)\}", source)
          refs = re.findall(r"\\(?:eqref|ref)\{([^}]+)\}", source)
          assert len(labels) == len(set(labels)), "Duplicate labels"
          previous = Path("chapters/pl/partial_differential_equations/03-rownania-laplace-a-i-poissona.tex")
          external = {"eq:pde3-green1": previous}
          for label, target in external.items():
              assert target.read_text(encoding="utf-8").count(r"\label{" + label + "}") == 1, label
          assert not set(labels) & set(external), "External label collides with local label"
          assert set(refs) <= set(labels) | set(external), f"Missing targets: {set(refs)-set(labels)-set(external)}"
          criteria = Path("tests/mathematical/partial_differential_equations/chapter-04/regression.md").read_text(encoding="utf-8")
          rows = re.findall(r"(?m)^\| (PDE-04-\d{3}[A-Z]?) \| ([^|]+) \|", criteria)
          assert rows, "No regression criteria"
          ids = [row[0] for row in rows]
          assert len(ids) == len(set(ids)), "Duplicate criterion IDs"
          base_ids = {int(x[7:10]) for x in ids if len(x) == 10}
          assert base_ids and base_ids == set(range(1, max(base_ids)+1)), "Missing base IDs"
          assert all(int(x[7:10]) in base_ids for x in ids), "Suffix without base ID"
          assert all(anchor.strip() in labels for _, anchor in rows), "Missing criterion anchor"
          print(f"{len(rows)} semantic criterion anchors verified (not executed proofs)")
          stack = []
          for kind, env in re.findall(r"\\(begin|end)\{([^}]+)\}", source):
              if kind == "begin":
                  stack.append(env)
              else:
                  assert stack and stack.pop() == env, f"Unmatched end: {env}"
          assert not stack, f"Unclosed environments: {stack}"
          print(f"{len(labels)} distinct labels; {len(refs)} resolved reference occurrences")
          book = Path("books/pl/partial_differential_equations.tex").read_text(encoding="utf-8")
          assert book.count(r"\begin{document}") == 1
          preamble = book.split(r"\begin{document}", 1)[0]
          inputs = re.findall(r"\\input\{\.\./\.\./(chapters/pl/partial_differential_equations/[^}]+)\}", book)
          import json
          manifest = json.loads(Path("catalog/partial_differential_equations_manifest.json").read_text(encoding="utf-8"))
          assert inputs == [row["path"] for row in manifest["chapters"]]
          chapter_number = inputs.index(chapter.as_posix()) + 1
          external_numbers = {label: inputs.index(path.as_posix()) + 1 for label, path in external.items()}
          canonical = Path("latex/pl/code-listings.tex").read_text(encoding="utf-8")
          for name, text in (("book", preamble), ("Atlas", Path("application/config/preambles/PDE.tex").read_text(encoding="utf-8"))):
              assert text.count(canonical) == 1, f"Stale code listings: {name}"
          # Derive the equation number from preceding numbered equations.
          # Fail closed on changes to numbering conventions or environment layout.
          assert r"\numberwithin{equation}{chapter}" in preamble
          previous_source = previous.read_text(encoding="utf-8")
          before = previous_source.split(r"\label{eq:pde3-green1}", 1)[0]
          assert len(re.findall(r"\\chapter(?:\[|\{)", before)) == 1
          assert not re.search(r"\\(?:setcounter|addtocounter|stepcounter|refstepcounter)\{(?:chapter|equation)\}|\\(?:tag|notag|nonumber)\b", before)
          assert not re.search(r"\\begin\{(?:gather|multline|flalign|alignat|eqnarray|subequations)\}", before)
          assert before.count(r"\begin{align}") == 1
          align_prefix = before.split(r"\begin{align}", 1)[1]
          assert r"\\" not in align_prefix, "Expected label on first align row"
          assert before.count(r"\begin{equation}") == before.count(r"\end{equation}")
          equation_index = before.count(r"\begin{equation}") + 1
          numbers = {"eq:pde3-green1": str(external_numbers["eq:pde3-green1"]) + "." + str(equation_index)}
          # Number-only references: target chapters are absent from isolated PDF.
          external_label = "\n".join([r"\makeatletter"] + [
              r"\@namedef{r@" + label + "}{{" + number + r"}{}{}{}{}}"
              for label, number in numbers.items()
          ] + [r"\makeatother"])
          print(f"Standalone chapter {chapter_number}; external labels (numbers only): {numbers}")
          Path("books/pl/partial_differential_equations_ch04_ci.tex").write_text(
              preamble + "\n" + external_label + "\n"
              + r"\begin{document}" + "\n"
              + r"\setcounter{chapter}{" + str(chapter_number-1) + "}\n"
              + r"\input{../../chapters/pl/partial_differential_equations/04-rownanie-ciepla.tex}"
              + "\n" + r"\end{document}" + "\n",
              encoding="utf-8",
          )
          PY
      - name: Compile standalone chapter with canonical preamble
        uses: xu-cheng/latex-action@v3
        with:
          root_file: partial_differential_equations_ch04_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect diagnostics and render pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          stem=books/pl/partial_differential_equations_ch04_ci
          test -s "$stem.pdf"
          test -s "$stem.log"
          pdfinfo "$stem.pdf"
          pdftotext -layout "$stem.pdf" "$stem.txt"
          mkdir -p books/pl/pde_ch04_render
          pdftoppm -r 120 -png "$stem.pdf" books/pl/pde_ch04_render/page
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' "$stem.log"; then
            echo 'Critical LaTeX diagnostics detected.'
            exit 1
          fi
      - name: Upload compiled chapter and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-ch04-audit
          path: |
            books/pl/partial_differential_equations_ch04_ci.pdf
            books/pl/partial_differential_equations_ch04_ci.log
            books/pl/partial_differential_equations_ch04_ci.txt
            books/pl/pde_ch04_render/
          if-no-files-found: warn
