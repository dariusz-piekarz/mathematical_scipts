name: Measure theory chapter 15 LII stabilization

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - "chapters/pl/measure_theory/15-dualnosc-wypuklosc-i-slaba-zbieznosc-w-przestrzeniach-lp.tex"
      - "books/pl/measure_theory.tex"
      - "chapters/pl/measure_theory/10-regularnosc-funkcji-mierzalnych-i-aproksymacja-funkcjami-ciaglymi.tex"
      - "chapters/pl/measure_theory/14-przestrzenie-lp-i-ich-podstawowe-wlasnosci.tex"
      - "tools/tests/test_measure_theory_ch15_li_gate.py"
      - "tools/tests/test_measure_theory_book_integrity.py"
      - "audits/measure_theory/00-audyt-lii-rozdzial-15-bramka-regresji-2026-11-23.md"
      - ".github/workflows/measure-theory-ch15-lii-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-ch15-lii-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Chapter 15 source and mathematical regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate test script syntax
        run: python -m py_compile tools/tests/test_measure_theory_ch15_li_gate.py
      - name: Run 8 independent LII regression cases on real repository sources
        run: python -m unittest discover -s tools/tests -p 'test_measure_theory_ch15_li_gate.py' -v
      - name: Audit cross-file labels, references and 31-chapter structure
        run: python -m unittest discover -s tools/tests -p 'test_measure_theory_book_integrity.py' -v

  pdf:
    name: Chapter 15 and complete measure theory PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX packages including lmodern and Polish babel
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-lang-polish poppler-utils
      - name: Compile complete 31-chapter book with cross-references
        run: |
          cd books/pl
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error measure_theory.tex
      - name: Verify book log and output PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          pdf = Path('books/pl/measure_theory.pdf')
          log = Path('books/pl/measure_theory.log')
          assert pdf.is_file() and pdf.stat().st_size > 10000, 'Missing or empty book PDF'
          content = log.read_text(encoding='utf-8', errors='replace')
          for phrase in ('There were undefined references', 'There were undefined citations', 'Rerun to get cross-references right'):
              assert phrase not in content, f'Unresolved full-book cross-reference: {phrase}'
          print('Full book PDF:', pdf.stat().st_size, 'bytes, no unresolved references')
          PY
      - name: Generate isolated chapter 15 with genuine external cross-references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('books/pl')
          chapter_path = Path('chapters/pl/measure_theory/15-dualnosc-wypuklosc-i-slaba-zbieznosc-w-przestrzeniach-lp.tex')
          chapter_tex = chapter_path.read_text(encoding='utf-8')
          local_labels = set(re.findall(r'\\label\{([^}]+)\}', chapter_tex))
          all_references = set(re.findall(r'\\(?:ref|eqref|pageref|autoref|nameref)\{([^}]+)\}', chapter_tex))
          needed_external = all_references - local_labels
          assert local_labels, 'No labels found in chapter 15'
          assert needed_external, 'No cross-chapter references detected'

          # The book compiles before this step. Import ONLY labels which
          # chapter 15 actually references, avoiding duplicate local labels
          # and misleading links to unrelated chapters.
          full_aux = (root / 'measure_theory.aux').read_text(encoding='utf-8')
          external_labels = []
          seen = set()
          for line in full_aux.splitlines():
              match = re.match(r'\\newlabel\{([^}]+)\}', line)
              if not match:
                  continue
              label = match.group(1)
              if label in needed_external:
                  assert label not in seen, f'Duplicate external label in full book: {label}'
                  external_labels.append(line)
                  seen.add(label)
          missing = needed_external - seen
          assert not missing, f'Unresolved chapter 15 external references: {sorted(missing)}'
          assert not (seen & local_labels), 'External/local label collision'
          (root / 'measure_theory_ch15_external.aux').write_text(
              r'\relax' + '\n' + '\n'.join(external_labels) + '\n', encoding='utf-8'
          )

          complete_tex = (root / 'measure_theory.tex').read_text(encoding='utf-8')
          marker = r'\begin{document}'
          assert marker in complete_tex
          header = complete_tex.split(marker, 1)[0]
          chapter = r'\input{../../chapters/pl/measure_theory/15-dualnosc-wypuklosc-i-slaba-zbieznosc-w-przestrzeniach-lp.tex}'
          external = r'\usepackage{xr-hyper}' + '\n' + \
              r'\externaldocument{measure_theory_ch15_external}[measure_theory.pdf]'
          (root / 'measure_theory_ch15_lii.tex').write_text(
              header + external + '\n' + marker + '\n' + r'\mainmatter' + '\n' +
              r'\setcounter{chapter}{14}' + '\n' + chapter + '\n' + r'\end{document}' + '\n',
              encoding='utf-8',
          )
          print('Imported', len(external_labels), 'external labels; excluded', len(local_labels), 'local labels')
          PY
      - name: Compile isolated chapter 15 PDF and verify cross-references
        run: |
          cd books/pl
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error measure_theory_ch15_lii.tex
          test -s measure_theory_ch15_lii.pdf
          python - <<'PY'
          from pathlib import Path
          log = Path('measure_theory_ch15_lii.log').read_text(encoding='utf-8', errors='replace')
          forbidden = (
              'There were undefined references',
              'There were undefined citations',
              'multiply defined',
              'Rerun to get cross-references right',
          )
          for phrase in forbidden:
              assert phrase not in log, f'Isolated chapter cross-references: {phrase}'
          print('Isolated chapter cross-references resolved')
          PY
      - name: Verify PDF page counts and render page previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def pages(path):
              data = subprocess.check_output(['pdfinfo', str(path)], text=True)
              line = next(line for line in data.splitlines() if line.startswith('Pages:'))
              return int(line.split(':', 1)[1].strip())

          book = Path('books/pl/measure_theory.pdf')
          chapter = Path('books/pl/measure_theory_ch15_lii.pdf')
          book_pages, chapter_pages = pages(book), pages(chapter)
          assert book_pages >= 100, f'Unexpectedly short full book: {book_pages} pages'
          assert 4 <= chapter_pages <= 25, f'Unexpected chapter PDF size: {chapter_pages} pages'
          print(f'Valid PDF page counts: book={book_pages}, chapter={chapter_pages}')
          PY
          mkdir -p books/pl/ch15_lii_previews
          count=$(pdfinfo books/pl/measure_theory_ch15_lii.pdf | awk '/^Pages:/ {print $2}')
          middle=$(( (count + 1) / 2 ))
          for n in 1 "$middle" "$count"; do
            pdftoppm -f "$n" -l "$n" -singlefile -r 100 -png               books/pl/measure_theory_ch15_lii.pdf "books/pl/ch15_lii_previews/chapter_p${n}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-theory-ch15-lii-pdf-and-logs
          if-no-files-found: warn
          retention-days: 14
          path: |
            books/pl/measure_theory.pdf
            books/pl/measure_theory.log
            books/pl/measure_theory_ch15_lii.pdf
            books/pl/measure_theory_ch15_lii.log
            books/pl/ch15_lii_previews/*.png
