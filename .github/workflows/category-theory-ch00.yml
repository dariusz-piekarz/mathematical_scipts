name: Category theory CAT-00 validation
on:
  push:
    branches: [biblioteka-matematyczna-iteracja-6]
    paths:
      - 'chapters/pl/category_theory/**'
      - 'books/pl/category_theory.tex'
      - 'tools/tests/test_category_theory_ch*.py'
      - '.github/workflows/category-theory-ch00.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Category theory regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_category_theory_ch*.py' -v
      - name: Compile full book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: category_theory.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify references and PDF
        run: |
          test -s books/pl/category_theory.pdf
          test -s books/pl/category_theory.log
          ! grep -E 'There were undefined references|LaTeX Warning: Reference .* undefined|LaTeX Warning: Citation .* undefined|Rerun to get cross-references right|^! ' books/pl/category_theory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-theory-pdf
          path: |
            books/pl/category_theory.pdf
            books/pl/category_theory.log
          if-no-files-found: warn
