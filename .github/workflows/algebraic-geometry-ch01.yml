name: Algebraic geometry ALG-01 mathematical and PDF validation

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/algebraic_geometry/01-*'
      - 'books/pl/algebraic_geometry.tex'
      - 'tools/tests/test_algebraic_geometry_ch01.py'
      - '.github/workflows/algebraic-geometry-ch01.yml'
  workflow_dispatch:

jobs:
  validate-alg01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ALG-01 finite-field and ideal regressions
        run: python3 -m unittest tools.tests.test_algebraic_geometry_ch01 -v
      - name: Create chapter-01-only LaTeX entrypoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          main = Path("books/pl/algebraic_geometry.tex")
          text = main.read_text(encoding="utf-8")
          pattern = r'\\input\{../../chapters/pl/algebraic_geometry/[^}]+\.tex\}'
          entries = re.findall(pattern, text)
          assert len(entries) == 11, f"Expected 11 chapter inputs, found {len(entries)}"
          kept = []
          for line in text.splitlines():
              if re.fullmatch(pattern, line.strip()) and not re.search(
                  r'/01-[^}]+\.tex\}', line):
                  continue
              kept.append(line)
          driver = "\n".join(kept) + "\n"
          assert driver.count(r'\input{../../chapters/pl/algebraic_geometry/01-') == 1
          assert driver.count(r'\input{../../chapters/pl/algebraic_geometry/') == 1
          assert r'\setcounter{chapter}{-1}' in driver
          driver = driver.replace(r'\setcounter{chapter}{-1}',
                                  r'\setcounter{chapter}{0}', 1)
          Path("books/pl/algebraic_geometry_ch01_audit.tex").write_text(
              driver, encoding="utf-8")
          PY
      - name: Compile ALG-01 twice and resolve references
        uses: xu-cheng/latex-action@v3
        with:
          root_file: algebraic_geometry_ch01_audit.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect PDF build log and missing references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pdf = Path("books/pl/algebraic_geometry_ch01_audit.pdf")
          log = Path("books/pl/algebraic_geometry_ch01_audit.log")
          assert pdf.exists() and pdf.stat().st_size > 10000
          assert log.exists()
          s = log.read_text(encoding="utf-8", errors="replace")
          for pattern in (
              r'LaTeX Warning: Reference .* undefined',
              r'LaTeX Warning: Citation .* undefined',
              r'There were undefined references',
              r'Rerun to get cross-references right',
              r'(?m)^! ',
          ):
              assert not re.search(pattern, s), pattern
          print(f"ALG-01 PDF checked: {pdf.stat().st_size} bytes")
          PY
      - name: Archive PDF and complete LaTeX log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algebraic-geometry-alg-01-audit
          path: |
            books/pl/algebraic_geometry_ch01_audit.pdf
            books/pl/algebraic_geometry_ch01_audit.log
          if-no-files-found: warn
