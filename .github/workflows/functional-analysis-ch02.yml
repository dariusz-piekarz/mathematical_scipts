name: Functional analysis - chapter 02 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/functional_analysis/01-przestrzenie-liniowo-topologiczne-definicje-i-przyklady.tex'
      - 'chapters/pl/functional_analysis/02-podprzestrzenie-produkty-ilorazy-i-topologie-uniwersalne.tex'
      - 'chapters/pl/functional_analysis/05-przestrzenie-lokalnie-wypukle-i-seminormy.tex'
      - 'books/pl/functional_analysis.tex'
      - 'tools/tests/test_functional_analysis_ch02.py'
      - 'audits/functional_analysis/02*'
      - '.github/workflows/functional-analysis-ch02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check 02 mathematics examples and reference contracts
        run: python3 tools/tests/test_functional_analysis_ch02.py
      - name: Prepare TeX wrapper from canonical preamble with cross-reference context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          book = Path("books/pl/functional_analysis.tex").read_text(encoding="utf-8")
          assert book.count(r"\begin{document}") == 1
          pre = book.split(r"\begin{document}", 1)[0]
          body = r"""
          \begin{document}
          \input{../../chapters/pl/functional_analysis/01-przestrzenie-liniowo-topologiczne-definicje-i-przyklady.tex}
          \input{../../chapters/pl/functional_analysis/02-podprzestrzenie-produkty-ilorazy-i-topologie-uniwersalne.tex}
          \input{../../chapters/pl/functional_analysis/05-przestrzenie-lokalnie-wypukle-i-seminormy.tex}
          \end{document}
          """
          Path("books/pl/functional_analysis_ch02_context_ci.tex").write_text(pre + body, encoding="utf-8")
          PY
      - name: Compile isolated chapter with actual 01 and 05 reference context
        uses: xu-cheng/latex-action@v3
        with:
          root_file: functional_analysis_ch02_context_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify PDF and resolve cross-chapter links
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test -s books/pl/functional_analysis_ch02_context_ci.pdf
          test -s books/pl/functional_analysis_ch02_context_ci.log
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' books/pl/functional_analysis_ch02_context_ci.log; then
            echo 'Chapter 02 LaTeX check failed; see diagnostics.'
            exit 1
          fi
          pdfinfo books/pl/functional_analysis_ch02_context_ci.pdf
          pdftotext -layout books/pl/functional_analysis_ch02_context_ci.pdf books/pl/functional_analysis_ch02_context_ci.txt
          grep -q 'Podprzestrzenie, produkty, ilorazy' books/pl/functional_analysis_ch02_context_ci.txt
          grep -q 'Końcowa topologia liniowo-topologiczna' books/pl/functional_analysis_ch02_context_ci.txt
          grep -q 'Przestrzenie lokalnie wypukłe i seminormy' books/pl/functional_analysis_ch02_context_ci.txt
      - name: Upload PDF and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-analysis-ch02-pdf
          path: |
            books/pl/functional_analysis_ch02_context_ci.pdf
            books/pl/functional_analysis_ch02_context_ci.log
            books/pl/functional_analysis_ch02_context_ci.txt
          if-no-files-found: warn
