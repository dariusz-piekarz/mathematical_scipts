name: Integration theory validation
on:
  push:
    paths:
      - 'books/pl/integration_theory.tex'
      - 'chapters/pl/integration_theory/**'
      - 'tests/mathematical/integration_theory/**'
      - '.github/workflows/integration_theory.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: |
          set -e
          for chapter in tests/mathematical/integration_theory/chapter-*; do
            python3 -m unittest discover -s "$chapter" -p 'test_*.py' -v
          done
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-lang-polish lmodern
      - name: Compile book
        working-directory: books/pl
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error integration_theory.tex
          pdflatex -interaction=nonstopmode -halt-on-error integration_theory.tex
          if grep -E 'There were undefined references|There were multiply-defined labels|LaTeX Warning: Reference .* undefined|destination with the same identifier' integration_theory.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: integration-theory
          path: books/pl/integration_theory.pdf
