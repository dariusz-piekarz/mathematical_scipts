name: PDE - chapter 33 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/partial_differential_equations/33-eksperymenty-numeryczne-do-rozdzialow-2-32.tex'
      - '.github/workflows/partial-differential-equations-ch33.yml'
  workflow_dispatch:

# Preserve independent manual audits; coalesce only obsolete queued pushes.
concurrency:
  group: atlas-partial-differential-equations-ch33-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-ch33:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check references and prepare standalone chapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          chapter = Path("chapters/pl/partial_differential_equations/33-eksperymenty-numeryczne-do-rozdzialow-2-32.tex")
          source = chapter.read_text(encoding="utf-8")
          labels = re.findall(r"\\label\{([^}]+)\}", source)
          refs = re.findall(r"\\(?:eqref|ref)\{([^}]+)\}", source)
          assert len(labels) == len(set(labels)), "Duplicate labels"
          root = Path("chapters/pl/partial_differential_equations")
          dependencies = [p for p in root.glob("*.tex") if p.name[:2] in
                          {"08", "11", "12", "13", "14", "16", "17", "18", "19", "23", "29", "30", "32"}]
          external = {}
          for target in dependencies:
              target_labels = re.findall(r"\\label\{([^}]+)\}", target.read_text(encoding="utf-8"))
              for label in set(refs)-set(labels):
                  if label in target_labels:
                      assert label not in external, f"Ambiguous target: {label}"
                      external[label] = target
          for label, target in external.items():
              assert target.read_text(encoding="utf-8").count(r"\label{" + label + "}") == 1, label
          assert not set(labels) & set(external), "External label collides with local label"
          assert set(refs) <= set(labels) | set(external), f"Missing targets: {set(refs)-set(labels)-set(external)}"
          stack = []
          for kind, env in re.findall(r"\\(begin|end)\{([^}]+)\}", source):
              if kind == "begin":
                  stack.append(env)
              else:
                  assert stack and stack.pop() == env, f"Unmatched end: {env}"
          assert not stack, f"Unclosed environments: {stack}"
          print(f"{len(labels)} distinct labels; {len(refs)} resolved reference occurrences")
          book = Path("books/pl/partial_differential_equations.tex").read_text(encoding="utf-8")
          assert book.count(r"\begin{document}") == 1
          preamble = book.split(r"\begin{document}", 1)[0]
          inputs = re.findall(r"\\input\{\.\./\.\./(chapters/pl/partial_differential_equations/[^}]+)\}", book)
          import json
          manifest = json.loads(Path("catalog/partial_differential_equations_manifest.json").read_text(encoding="utf-8"))
          assert inputs == [row["path"] for row in manifest["chapters"]]
          chapter_number = inputs.index(chapter.as_posix()) + 1
          assert chapter_number == 33
          external_numbers = {label: inputs.index(path.as_posix()) + 1 for label, path in external.items()}
          canonical = Path("latex/pl/code-listings.tex").read_text(encoding="utf-8")
          for name, text in (("book", preamble), ("Atlas", Path("application/config/preambles/PDE.tex").read_text(encoding="utf-8"))):
              assert text.count(canonical) == 1, f"Stale code listings: {name}"
          # Generate genuine reference numbers using LaTeX itself.
          dependency_inputs = "\n".join(
              r"\setcounter{chapter}{" + str(inputs.index(p.as_posix())) + "}\n"
              + r"\input{../../" + p.as_posix() + "}"
              for p in sorted(set(external.values()))
          )
          Path("books/pl/pde33_dependencies.tex").write_text(
              preamble + "\n" + r"\begin{document}" + "\n"
              + dependency_inputs + "\n" + r"\end{document}" + "\n",
              encoding="utf-8",
          )
          Path("books/pl/pde33_external.json").write_text(json.dumps(sorted(external)))
          Path("books/pl/partial_differential_equations_ch33_ci.tex").write_text(
              preamble + "\n" + r"\begin{document}" + "\n"
              + r"\appendix" + "\n" + r"\setcounter{chapter}{0}" + "\n"
              + r"\input{../../" + chapter.as_posix() + "}" + "\n"
              + r"\end{document}" + "\n", encoding="utf-8")
          PY
      - name: Compile dependency chapters for real reference numbers
        uses: xu-cheng/latex-action@v3
        with:
          root_file: pde33_dependencies.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Transfer verified external reference numbers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path("books/pl")
          wanted = set(json.loads((root / "pde33_external.json").read_text()))
          aux = (root / "pde33_dependencies.aux").read_text(encoding="utf-8")
          records = {}
          for label, number in re.findall(r"\\newlabel\{([^}]+)\}\{\{([^{}]*)\}", aux):
              if label in wanted:
                  assert label not in records and number, label
                  records[label] = number
          assert set(records) == wanted, wanted-set(records)
          standalone = root / "partial_differential_equations_ch33_ci.tex"
          source = standalone.read_text(encoding="utf-8")
          external_labels = "\n".join([r"\makeatletter"] + [
              r"\@namedef{r@" + label + "}{{" + number + r"}{}{}{}{}}"
              for label, number in sorted(records.items())
          ] + [r"\makeatother"])
          standalone.write_text(source.replace(r"\begin{document}",
              external_labels + "\n" + r"\begin{document}", 1), encoding="utf-8")
          print(f"Resolved {len(records)} external labels")
          PY
      - name: Compile standalone chapter with canonical preamble
        uses: xu-cheng/latex-action@v3
        with:
          root_file: partial_differential_equations_ch33_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect diagnostics and render pages
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          stem=books/pl/partial_differential_equations_ch33_ci
          test -s "$stem.pdf"
          test -s "$stem.log"
          pdfinfo "$stem.pdf"
          pdftotext -layout "$stem.pdf" "$stem.txt"
          mkdir -p books/pl/pde_ch33_render
          pdftoppm -r 120 -png "$stem.pdf" books/pl/pde_ch33_render/page
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' "$stem.log"; then
            echo 'Critical LaTeX diagnostics detected.'
            exit 1
          fi
      - name: Upload compiled chapter and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-ch33-audit
          path: |
            books/pl/partial_differential_equations_ch33_ci.pdf
            books/pl/partial_differential_equations_ch33_ci.log
            books/pl/partial_differential_equations_ch33_ci.txt
            books/pl/pde_ch33_render/
          if-no-files-found: warn


  run-listings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=2,<3' 'scipy>=1.13,<2' 'plotly>=5.24,<7' 'matplotlib>=3.9,<4'
      - name: Extract and execute every listing independently
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          source = Path("chapters/pl/partial_differential_equations/33-eksperymenty-numeryczne-do-rozdzialow-2-32.tex").read_text(encoding="utf-8")
          pattern = r"(?ms)^\\begin\{lstlisting\}\[(.*?)\]\s*\n(.*?)^\\end\{lstlisting\}"
          blocks = re.findall(pattern, source)
          assert len(blocks) == 29, f"Expected 29 listings, found {len(blocks)}"
          root = Path("pde33-results").resolve()
          root.mkdir(exist_ok=True)
          results = []
          names = set()
          for index, (header, code) in enumerate(blocks, 1):
              label = re.search(r"label=\{([^}]+)\}", header).group(1)
              assert label not in names, label
              names.add(label)
              folder = root / f"{index:02d}-{label.replace(':', '-')}"
              folder.mkdir()
              script = folder / "experiment.py"
              script.write_text(code, encoding="utf-8")
              start = time.monotonic()
              row = {"label": label, "status": "failed", "html": []}
              try:
                  ast.parse(code, filename=str(script))
                  proc = subprocess.run([sys.executable, str(script)], cwd=folder,
                                        text=True, encoding="utf-8", errors="replace",
                                        stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                        timeout=180, env=os.environ.copy())
                  (folder / "execution.log").write_text(proc.stdout, encoding="utf-8")
                  if proc.returncode:
                      raise RuntimeError(f"Exit code {proc.returncode}")
                  outputs = sorted(folder.glob("*.html"))
                  assert outputs, "No HTML outputs"
                  for path in outputs:
                      html = path.read_text(encoding="utf-8")
                      assert "Plotly.newPlot" in html and "plotly.js" in html.lower(), path.name
                      assert path.stat().st_size > 10000, path.name
                  row["html"] = [p.name for p in outputs]
                  row["status"] = "passed"
              except Exception as exc:
                  row["error"] = repr(exc)
                  if not (folder / "execution.log").exists():
                      (folder / "execution.log").write_text(repr(exc), encoding="utf-8")
              row["seconds"] = round(time.monotonic()-start, 3)
              results.append(row)
              print(json.dumps(row, ensure_ascii=False), flush=True)
          (root / "results.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
          passed = sum(row["status"] == "passed" for row in results)
          print(f"RESULT: {passed}/{len(results)} listings passed")
          assert passed == len(results), "One or more listings failed"
          PY
      - name: Upload experiment outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde33-numerical-audit
          path: pde33-results/
          compression-level: 6
          if-no-files-found: warn
