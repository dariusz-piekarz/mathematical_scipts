name: Atlas - real rootless Docker preflight

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - ".github/workflows/atlas-rootless-probe.yml"
      - "application/scripts/lean_rootless_ci_probe.py"
      - "application/backend/lean_draft_transport.py"
      - "application/backend/lean_draft_runner.py"
      - "application/tests/test_lean_draft_transport.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-rootless-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rootless-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dedicated rootless test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends uidmap dbus-user-session slirp4netns fuse-overlayfs busybox-static ca-certificates curl gnupg
          if ! command -v dockerd-rootless-setuptool.sh >/dev/null; then
            # The hosted image does not necessarily configure Docker's APT source.
            sudo install -m 0755 -d /etc/apt/keyrings
            key="$(mktemp)"
            curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg -o "$key"
            fingerprint="$(gpg --batch --show-keys --with-colons "$key" | awk -F: '$1=="fpr" {print $10; exit}')"
            test "$fingerprint" = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"
            sudo install -m 0644 "$key" /etc/apt/keyrings/atlas-docker.asc
            rm -f "$key"
            . /etc/os-release
            printf 'deb [arch=%s signed-by=/etc/apt/keyrings/atlas-docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/atlas-docker.list
            sudo apt-get update -qq
            engine_version="$(dpkg-query -W -f='${Version}' docker-ce)"
            sudo apt-get install -y --no-install-recommends "docker-ce-rootless-extras=$engine_version"
          fi
          command -v dockerd-rootless-setuptool.sh
          /usr/bin/docker --version
          dpkg-query -W busybox-static uidmap
          test "$(id -u)" -ne 0
          test -f /sys/fs/cgroup/cgroup.controllers
          grep -q "^$(id -un):" /etc/subuid
          grep -q "^$(id -un):" /etc/subgid
          # Rootless Docker needs delegated cgroup v2 controllers, not merely
          # a cgroup v2 mount. Scope the runtime drop-in to this CI user.
          # https://docs.docker.com/engine/security/rootless/tips/
          unit="user@$(id -u).service"
          sudo install -d -m 0755 "/run/systemd/system/$unit.d"
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee "/run/systemd/system/$unit.d/atlas-delegate.conf"
          # Preserve diagnostics if a hosted runner cannot start its user manager.
          runtime_unit="user-runtime-dir@$(id -u).service"
          trap 'sudo systemctl status "$unit" "$runtime_unit" --no-pager || true; sudo journalctl -b -u "$unit" -u "$runtime_unit" -n 80 --no-pager || true' ERR
          sudo systemctl daemon-reload
          # Establish the runtime directory and keep the manager alive across
          # restart before touching an existing session.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "$runtime_unit"
          has_required_controllers() {
            local cg controller
            cg="$(systemctl show -p ControlGroup --value "$unit")"
            test -n "$cg" && test -r "/sys/fs/cgroup$cg/cgroup.controllers" || return 1
            for controller in cpu memory pids; do
              grep -qw "$controller" "/sys/fs/cgroup$cg/cgroup.controllers" || return 1
            done
          }
          if sudo systemctl is-active --quiet "$unit"; then
            if ! has_required_controllers; then
              cg="$(systemctl show -p ControlGroup --value "$unit")"
              test -n "$cg"
              self_cg="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
              case "$self_cg" in
                "$cg"|"$cg/"*) echo "CI process is inside user manager; refusing restart"; exit 1 ;;
              esac
              sudo systemctl restart "$unit"
            fi
          else
            sudo systemctl start "$unit"
          fi
          # The actual daemon capability check in Python remains mandatory.
          test -S "/run/user/$(id -u)/bus"
          cg="$(systemctl show -p ControlGroup --value "$unit")"
          test -n "$cg"
          systemctl show -p Delegate -p ControlGroup "$unit"
          cat "/sys/fs/cgroup$cg/cgroup.controllers"
          for controller in cpu memory pids; do
            grep -qw "$controller" "/sys/fs/cgroup$cg/cgroup.controllers"
          done
      - name: Start dedicated user-owned Docker daemon
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dockerd-rootless-setuptool.sh install --force
          systemctl --user start docker.service
          test -S "$XDG_RUNTIME_DIR/docker.sock"
          test ! -L "$XDG_RUNTIME_DIR/docker.sock"
          test ! -L "$XDG_RUNTIME_DIR"
          test "$(stat -c %u "$XDG_RUNTIME_DIR")" = "$(id -u)"
          test "$(stat -c %u "$XDG_RUNTIME_DIR/docker.sock")" = "$(id -u)"
          stat -c '%F %a uid=%u %n' "$XDG_RUNTIME_DIR" "$XDG_RUNTIME_DIR/docker.sock"
          # Restrict this dedicated CI daemon's socket, not the application guard.
          chmod 0700 "$XDG_RUNTIME_DIR"
          chmod 0600 "$XDG_RUNTIME_DIR/docker.sock"
          stat -c '%F %a uid=%u %n' "$XDG_RUNTIME_DIR" "$XDG_RUNTIME_DIR/docker.sock"
          /usr/bin/docker --host "unix://$XDG_RUNTIME_DIR/docker.sock" version
      - name: Check actual container metadata through application transport
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.lean_rootless_ci_probe
      - name: Stop test daemon
        if: always()
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user stop docker.service || true
