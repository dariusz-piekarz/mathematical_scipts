      - "tools/tests/test_abstract_algebra_ch22_audit5.py"
      - ".github/workflows/abstract-algebra-chapter.yml"
  workflow_dispatch:

jobs:
  validate-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mathematical regression dependencies
        run: python -m pip install sympy
      - name: Validate chapter dependencies
        run: python tools/audit_chapter_dependencies.py
      - name: Report pre-existing global repository validation findings
        continue-on-error: true
        run: python tools/validate_repository.py
      - name: Run repository tool tests
        run: python -m unittest discover -s tools/tests -v
      - name: Run abstract-algebra regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch01 -v
      - name: Run AA-02 regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch02 -v
      - name: Run AA-03 regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch03 -v
      - name: Run AA-04 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch04 -v
      - name: Run AA-05 regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch05 -v
      - name: Run AA-06 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch06 -v
      - name: Run AA-07 regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch07 -v
      - name: Run AA-08 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch08 -v
      - name: Run AA-09 regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch09 -v
      - name: Run AA-10 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch10 -v
      - name: Run AA-11 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch11 -v
      - name: Run AA-12 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch12 -v
      - name: Run AA-13 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch13 -v
      - name: Run AA-14 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch14 -v
      - name: Run AA-15 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch15 -v
      - name: Run AA-16 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch16 -v
      - name: Run AA-17 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch17 -v
      - name: Run AA-18 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch18 -v
      - name: Run AA-19 mathematical regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch19 -v
      - name: Run AA-20 mathematical regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch20 -v
          python -m unittest tools.tests.test_abstract_algebra_ch20_extra -v
      - name: Run AA-21 mathematical regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch21 -v
          python -m unittest tools.tests.test_abstract_algebra_ch21_extra -v
          python -m unittest tools.tests.test_abstract_algebra_ch21_independent -v
      - name: Run AA-22 mathematical regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch22 -v
          python -m unittest tools.tests.test_abstract_algebra_ch22_extra -v
          python -m unittest tools.tests.test_abstract_algebra_ch22_independent -v
          python -m unittest tools.tests.test_abstract_algebra_ch22_audit4 -v
          python -m unittest tools.tests.test_abstract_algebra_ch22_audit5 -v
      - name: Run AA-23 mathematical regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch23 -v
          python -m unittest tools.tests.test_abstract_algebra_ch23_extra -v
          python -m unittest tools.tests.test_abstract_algebra_ch23_independent -v
      - name: Run AA-26 independent Kummer regression tests
        run: python -m unittest tools.tests.test_abstract_algebra_ch26_independent -v
      - name: Run AA-27 Artin-Schreier regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch27 -v
          python -m unittest tools.tests.test_abstract_algebra_ch27_independent -v
      - name: Run AA-28 cyclotomic regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch28 -v
          python -m unittest tools.tests.test_abstract_algebra_ch28_independent -v
      - name: Run AA-29 finite-field mathematical regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch29 -v
          python -m unittest tools.tests.test_abstract_algebra_ch29_independent -v
      - name: Run AA-30 constructibility regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch30 -v
          python -m unittest tools.tests.test_abstract_algebra_ch30_independent -v
      - name: Run AA-31 symmetric-polynomial regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch31 -v
          python -m unittest tools.tests.test_abstract_algebra_ch31_independent -v
      - name: Run AA-32 discriminant and Galois regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch32 -v
          python -m unittest tools.tests.test_abstract_algebra_ch32_independent -v
      - name: Run AA-33 resultant and Sylvester regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch33 -v
          python -m unittest tools.tests.test_abstract_algebra_ch33_independent -v
      - name: Run AA-34 quartic resolvent and Galois regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch34 -v
          python -m unittest tools.tests.test_abstract_algebra_ch34_independent -v
      - name: Run AA-35 Frobenius and reduction regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch35 -v
          python -m unittest tools.tests.test_abstract_algebra_ch35_independent -v
      - name: Run AA-36 generic polynomial regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch36 -v
          python -m unittest tools.tests.test_abstract_algebra_ch36_independent -v
      - name: Run AA-37 transcendence basis regression tests
        run: |
          python -m unittest tools.tests.test_abstract_algebra_ch37 -v
          python -m unittest tools.tests.test_abstract_algebra_ch37_independent -v
      - name: Compile AA-01 to AA-37 book with latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: abstract_algebra.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify PDF and references (no undefined refs)
        shell: bash
        run: |
          test -s books/pl/abstract_algebra.pdf
          python - <<'PY'
          from pathlib import Path
          import re

          log = Path("books/pl/abstract_algebra.log").read_text(errors="replace")
          unresolved = set(re.findall(
              r"LaTeX Warning: Reference `([^']+)' on page \d+ undefined", log
          ))
          unexpected = unresolved
          if unexpected:
              raise SystemExit("Unexpected undefined references: " + repr(sorted(unexpected)))
          if "There were undefined references." in log and not unresolved:
              raise SystemExit("Unparsed undefined references in the LaTeX log")
          if re.search(r"LaTeX Warning: Citation .+ undefined", log):
              raise SystemExit("Undefined citation found")
          PY
      - name: Archive build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abstract-algebra-aa01-aa37
          path: |
            books/pl/abstract_algebra.pdf
            books/pl/abstract_algebra.log
          if-no-files-found: warn
