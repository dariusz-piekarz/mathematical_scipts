      - name: Run chapter 17 formal arithmetic and Godel coding regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch17 -v
      - name: Run chapter 18 representability and diagonalization regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch18 -v
      - name: Run chapter 19 Godel Rosser regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch19 -v
      - name: Run chapter 20 Tarski truth and derivability regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch20 -v
      - name: Run chapter 21 proof operations and derivability regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch21 -v
      - name: Run chapter 22 Godel II and Lob theorem regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch22 -v
      - name: Run chapter 23 downward Lowenheim-Skolem regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch23 -v
      - name: Run chapter 24 upward Lowenheim-Skolem regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch24 -v
      - name: Run chapter 25 ZF construction and arithmetic regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch25 -v
      - name: Run chapter 26 axiom of choice regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch26 -v
      - name: Run chapter 27 cardinal arithmetic regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch27 -v
      - name: Run chapter 28 ordinals regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch28 -v
      - name: Run chapter 29 weak choice regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch29 -v
      - name: Run chapter 30 game determinacy regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch30 -v
      - name: Run chapter 31 constructibility regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch31 -v
      - name: Run chapter 32 forcing and generic-model regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch32 -v
      - name: Compile logic and set theory PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: logic_and_set_theory.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Check compiled PDF and log
        shell: bash
        run: |
          test -s books/pl/logic_and_set_theory.pdf
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("books/pl/logic_and_set_theory.log").read_text(errors="replace")
          refs = set(re.findall(r"LaTeX Warning: Reference `([^']+)' on page \d+ undefined", log))
          allowed = set()
          assert refs <= allowed, f"Unexpected undefined references: {sorted(refs - allowed)}"
          assert not re.search(r"Overfull \\hbox", log), "Overfull TeX boxes"
          assert not re.search(r"LaTeX Warning: Citation .+ undefined", log), "Undefined citation"
          print("PASS: PDF present; no unexpected references, missing citations or overfull boxes")
          if refs:
              print("Documented forward references (not yet imported):", sorted(refs))
          PY
      - name: Archive logic and set theory PDF and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-and-set-theory-ch01-ch32
          path: |
            books/pl/logic_and_set_theory.pdf
            books/pl/logic_and_set_theory.log
          if-no-files-found: warn
