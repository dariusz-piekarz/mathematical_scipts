jobs:
  validate-chapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CLI imports, theorem inventory and chapter references
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          catalog = json.loads(Path("catalog/books.json").read_text(encoding="utf-8"))
          book = next(item for item in catalog["books"] if item["id"] == "logic_and_set_theory")
          chapters = book["chapters"]
          assert len(chapters) >= 32, chapters
          expected_names = [
              "01-zdania-i-spojniki-logiczne.tex",
              "02-kwantyfikatory-i-podstawowe-metody-dowodzenia.tex",
              "03-zbiory-i-operacje-na-zbiorach.tex",
              "04-pary-uporzadkowane-i-relacje.tex",
              "05-relacje-rownowaznosci-i-zbiory-ilorazowe.tex",
              "06-relacje-porzadku-od-porownywania-do-kresow.tex",
              "07-funkcje-i-odwzorowania.tex",
              "08-obrazy-przeciwobrazy-i-dzialania-na-funkcjach.tex",
              "09-jezyki-formalne-termy-i-formuly.tex",
              "10-struktury-wartosciowania-i-prawda.tex",
              "11-dowody-formalne-i-dedukcja-naturalna.tex",
              "12-poprawnosc-logiki-pierwszego-rzedu.tex",
              "13-twierdzenie-godla-o-pelnosci-i-konstrukcja-henkina.tex",
              "14-twierdzenie-o-zwartosci-i-jego-zastosowania.tex",
              "15-homomorfizmy-izomorfizmy-i-elementarnosc-struktur.tex",
              "16-algorytmy-obliczalnosc-i-nierozstrzygalnosc.tex",
              "17-arytmetyka-formalna-i-kodowanie-skladni.tex",
              "18-reprezentowalnosc-i-diagonalizacja.tex",
              "19-pierwsze-twierdzenie-godla-o-niezupelnosci.tex",
              "20-prawda-arytmetyczna-i-twierdzenie-tarskiego.tex",
              "21-operacje-na-dowodach-i-warunki-wyprowadzalnosci.tex",
              "22-drugie-twierdzenie-godla-i-twierdzenie-loba.tex",
              "23-dolne-twierdzenie-lowenheima-skolema-i-domkniecia-skolema.tex",
              "24-gorne-twierdzenie-lowenheima-skolema-i-paradoks-skolema.tex",
              "25-aksjomaty-zf-zfc-i-konstrukcje-zbiorowe.tex",
              "26-aksjomat-wyboru-i-jego-rownowazne-postacie.tex",
              "27-liczby-kardynalne-i-arytmetyka-mocy.tex",
              "28-liczby-porzadkowe-i-rekurencja-pozaskonczona.tex",
              "29-slabsze-zasady-wyboru-i-ich-ograniczenia.tex",
              "30-gry-nieskonczone-i-aksjomat-determinacji.tex",
              "31-uniwersum-konstruowalne-i-modele-wewnetrzne.tex",
              "32-podstawy-wymuszania-i-modele-generyczne.tex",
          ]
          assert [Path(path).name for path in chapters[:32]] == expected_names
          entry = Path(book["entrypoint"])
          text = entry.read_text(encoding="utf-8")
          sources = []
          for path in chapters[:32]:
              chapter = Path(path)
              assert chapter.is_file(), path
              assert "\\input{../../" + path + "}" in text, path
              sources.append(chapter.read_text(encoding="utf-8"))
          labels = [name for source in sources for name in re.findall(r"\\label\{([^}]+)\}", source)]
          refs = [name for source in sources for name in re.findall(r"\\(?:ref|eqref|autoref)\{([^}]+)\}", source)]
          assert len(labels) == len(set(labels)), "Duplicate LaTeX labels"
          assert len(labels) == 803, f"Unexpected labels: {len(labels)}"
          assert len(refs) == 590, f"Unexpected references: {len(refs)}"
          forward = set()
          assert set(refs) - set(labels) == forward, "Unexpected unresolved targets in partial book"
          inventories = [
              (sources[5], {"twierdzenie": 15, "wniosek": 1, "proof": 16,
                            "definicja": 12, "przyklad": 21, "uwaga": 7}),
              (sources[6], {"twierdzenie": 11, "wniosek": 0, "proof": 11,
                            "definicja": 5, "przyklad": 10, "uwaga": 9}),
              (sources[7], {"twierdzenie": 20, "wniosek": 0, "proof": 20,
                            "definicja": 6, "przyklad": 16, "uwaga": 1}),
              (sources[8], {"twierdzenie": 2, "stwierdzenie": 1,
                            "lemat": 5, "proof": 8,
                            "definicja": 7, "przyklad": 13, "uwaga": 3}),
              (sources[9], {"twierdzenie": 5, "stwierdzenie": 1,
                            "lemat": 2, "wniosek": 1, "proof": 9,
                            "definicja": 8, "przyklad": 16, "uwaga": 3}),
              (sources[10], {"twierdzenie": 5, "stwierdzenie": 0,
                             "lemat": 0, "wniosek": 0, "proof": 5,
                             "definicja": 7, "przyklad": 16, "uwaga": 8}),
              (sources[11], {"twierdzenie": 3, "lemat": 3,
                             "wniosek": 2, "proof": 8,
                             "definicja": 1, "przyklad": 4, "uwaga": 3}),
              (sources[12], {"twierdzenie": 5, "lemat": 11,
                             "wniosek": 0, "stwierdzenie": 0,
                             "proof": 16, "definicja": 6,
                             "przyklad": 6, "uwaga": 4, "figure": 1}),
              (sources[13], {"twierdzenie": 7, "lemat": 0,
                             "wniosek": 1, "proof": 8,
                             "definicja": 5, "przyklad": 3, "uwaga": 5}),
              (sources[14], {"twierdzenie": 5, "lemat": 1,
                             "wniosek": 0, "proof": 6,
                             "definicja": 7, "przyklad": 7, "uwaga": 4}),
              (sources[15], {"twierdzenie": 5, "lemat": 2,
                             "wniosek": 1, "proof": 8,
                             "definicja": 5, "przyklad": 6,
                             "uwaga": 4, "figure": 1}),
              (sources[16], {"twierdzenie": 0, "lemat": 5,
                             "wniosek": 0, "proof": 5,
                             "definicja": 10, "przyklad": 5, "uwaga": 11,
                             "figure": 0}),
              (sources[17], {"twierdzenie": 2, "lemat": 5, "wniosek": 0,
                             "proof": 7, "definicja": 3,
                             "przyklad": 4, "uwaga": 3}),
              (sources[18], {"twierdzenie": 2, "lemat": 2, "wniosek": 2,
                             "proof": 6, "definicja": 3,
                             "przyklad": 3, "uwaga": 6}),
              (sources[19], {"twierdzenie": 3, "lemat": 1, "wniosek": 0,
                             "proof": 4, "definicja": 3,
                             "przyklad": 5, "uwaga": 7}),
              (sources[20], {"twierdzenie": 2, "lemat": 5, "wniosek": 0,
                             "proof": 7, "definicja": 0,
                             "przyklad": 3, "uwaga": 4}),
              (sources[21], {"twierdzenie": 3, "lemat": 2, "wniosek": 1,
                             "proof": 6, "definicja": 1,
                             "przyklad": 2, "uwaga": 5}),
              (sources[22], {"twierdzenie": 1, "lemat": 2, "wniosek": 1,
                             "proof": 4, "definicja": 3,
                             "przyklad": 2, "uwaga": 3}),
              (sources[23], {"twierdzenie": 4, "lemat": 2, "wniosek": 1,
                             "proof": 7, "definicja": 2,
                             "przyklad": 2, "uwaga": 6}),
              (sources[24], {"twierdzenie": 11, "lemat": 6, "wniosek": 2,
                             "proof": 19, "definicja": 16,
                             "przyklad": 14, "uwaga": 5, "figure": 1}),
              (sources[25], {"twierdzenie": 8, "lemat": 1, "wniosek": 1,
                             "proof": 10, "definicja": 5,
                             "przyklad": 10, "uwaga": 2}),
              (sources[26], {"twierdzenie": 11, "wniosek": 2,
                             "proof": 13, "definicja": 4,
                             "przyklad": 5, "uwaga": 6, "figure": 1}),
              (sources[27], {"twierdzenie": 5, "lemat": 2,
                             "wniosek": 1, "proof": 8,
                             "definicja": 4, "przyklad": 5, "uwaga": 3}),
              (sources[28], {"twierdzenie": 7, "lemat": 1,
                             "proof": 8, "definicja": 6,
                             "przyklad": 5, "uwaga": 7}),
              (sources[29], {"twierdzenie": 15, "lemat": 9,
                             "wniosek": 4, "proof": 26, "definicja": 12,
                             "przyklad": 7, "uwaga": 15, "figure": 1}),
              (sources[30], {"twierdzenie": 5, "lemat": 27,
                             "wniosek": 2, "proof": 34, "definicja": 6,
                             "przyklad": 9, "uwaga": 16}),
              (sources[31], {"twierdzenie": 4, "lemat": 7,
                             "wniosek": 1, "proof": 12, "definicja": 11,
                             "przyklad": 4, "uwaga": 4, "figure": 1}),
          ]
          for source, inventory in inventories:
              for env, expected in inventory.items():
                  actual = source.count("\\begin{" + env + "}")
                  assert actual == expected, (env, actual, expected)
              stack = []
              for kind, env in re.findall(r"\\(begin|end)\{([^}]+)\}", source):
                  if kind == "begin":
                      stack.append(env)
                  else:
                      assert stack and stack.pop() == env, ("Unbalanced environment", env)
              assert not stack, ("Unclosed environments", stack)
          print(f"PASS: imports, chapter order, {len(labels)} labels, {len(refs)} references, {len(forward)} documented forward reference(s), inventories and TeX environments")
          PY
      - name: Run chapter 07 finite-model regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch07 -v
      - name: Run chapter 08 finite-model regression tests
        run: python -m unittest tools.tests.test_logic_and_set_theory_ch08 -v
