name: PDE - chapter 01 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/partial_differential_equations/01-wprowadzenie-do-pde.tex'
      - 'books/pl/partial_differential_equations.tex'
      - 'tests/mathematical/partial_differential_equations/chapter-01/**'
      - '.github/workflows/partial-differential-equations-ch01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch01:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run executable regression checks
        run: python3 tests/mathematical/partial_differential_equations/chapter-01/test_energy_hadamard.py -v
      - name: Check references and prepare standalone chapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          chapter = Path("chapters/pl/partial_differential_equations/01-wprowadzenie-do-pde.tex")
          source = chapter.read_text(encoding="utf-8")
          labels = re.findall(r"\\label\{([^}]+)\}", source)
          refs = re.findall(r"\\(?:eqref|ref)\{([^}]+)\}", source)
          assert len(labels) == len(set(labels)), "Duplicate labels"
          assert set(refs) <= set(labels), f"Missing targets: {set(refs)-set(labels)}"
          stack = []
          for kind, env in re.findall(r"\\(begin|end)\{([^}]+)\}", source):
              if kind == "begin":
                  stack.append(env)
              else:
                  assert stack and stack.pop() == env, f"Unmatched end: {env}"
          assert not stack, f"Unclosed environments: {stack}"
          print(f"{len(labels)} distinct labels; {len(refs)} resolved reference occurrences")
          book = Path("books/pl/partial_differential_equations.tex").read_text(encoding="utf-8")
          assert book.count(r"\begin{document}") == 1
          preamble = book.split(r"\begin{document}", 1)[0]
          Path("books/pl/partial_differential_equations_ch01_ci.tex").write_text(
              preamble + "\n" + r"\begin{document}" + "\n"
              + r"\input{../../chapters/pl/partial_differential_equations/01-wprowadzenie-do-pde.tex}"
              + "\n" + r"\end{document}" + "\n",
              encoding="utf-8",
          )
          PY
      - name: Compile standalone chapter with canonical preamble
        uses: xu-cheng/latex-action@v3
        with:
          root_file: partial_differential_equations_ch01_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect diagnostics and render pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          stem=books/pl/partial_differential_equations_ch01_ci
          test -s "$stem.pdf"
          test -s "$stem.log"
          pdfinfo "$stem.pdf"
          pdftotext -layout "$stem.pdf" "$stem.txt"
          mkdir -p books/pl/pde_ch01_render
          pdftoppm -r 120 -png "$stem.pdf" books/pl/pde_ch01_render/page
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' "$stem.log"; then
            echo 'Critical LaTeX diagnostics detected.'
            exit 1
          fi
      - name: Upload compiled chapter and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-ch01-audit
          path: |
            books/pl/partial_differential_equations_ch01_ci.pdf
            books/pl/partial_differential_equations_ch01_ci.log
            books/pl/partial_differential_equations_ch01_ci.txt
            books/pl/pde_ch01_render/
          if-no-files-found: warn
