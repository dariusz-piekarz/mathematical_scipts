name: Functional analysis - chapter 27 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/functional_analysis/27-*.tex'
      - 'tools/tests/test_functional_analysis_ch27.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch27:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check chapter 27 Schauder basis regressions
        run: python3 tools/tests/test_functional_analysis_ch27.py
      - name: Prepare TeX wrapper with complete reference context 01-27 (including 15A/15B)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          book = Path('books/pl/functional_analysis.tex').read_text(encoding='utf-8')
          assert book.count(r'\begin{document}') == 1
          pre = book.split(r'\begin{document}', 1)[0]
          inputs = re.findall(
              r'\\input\{(\.\./\.\./chapters/pl/functional_analysis/[^}]+)\}',
              book
          )
          assert len(inputs) >= 29
          assert all(inputs[i].split('/')[-1].startswith(f'{i+1:02d}-')
                     for i in range(15))
          assert inputs[15].split('/')[-1].startswith('15A-')
          assert inputs[16].split('/')[-1].startswith('15B-')
          assert inputs[17].split('/')[-1].startswith('16-')
          assert inputs[18].split('/')[-1].startswith('17-')
          assert inputs[19].split('/')[-1].startswith('18-')
          assert inputs[20].split('/')[-1].startswith('19-')
          assert inputs[21].split('/')[-1].startswith('20-')
          assert inputs[22].split('/')[-1].startswith('21-')
          assert inputs[23].split('/')[-1].startswith('22-')
          assert inputs[24].split('/')[-1].startswith('23-')
          assert inputs[25].split('/')[-1].startswith('24-')
          assert inputs[26].split('/')[-1].startswith('25-')
          assert inputs[27].split('/')[-1].startswith('26-')
          assert inputs[28].split('/')[-1].startswith('27-')
          body = r'\begin{document}' + '\n'
          body += '\n'.join(r'\input{' + name + '}' for name in inputs[:29])
          body += '\n' + r'\end{document}' + '\n'
          Path('books/pl/functional_analysis_ch27_context_ci.tex').write_text(
              pre + body, encoding='utf-8'
          )
          PY
      - name: Compile chapter 27 with complete 01-27 reference context
        uses: xu-cheng/latex-action@v3
        with:
          root_file: functional_analysis_ch27_context_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Verify PDF, chapter heading, mathematical content and cross-references
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          test -s books/pl/functional_analysis_ch27_context_ci.pdf
          test -s books/pl/functional_analysis_ch27_context_ci.log
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' books/pl/functional_analysis_ch27_context_ci.log; then
            echo 'Chapter 27 LaTeX diagnostics failed.'
            exit 1
          fi
          pdfinfo books/pl/functional_analysis_ch27_context_ci.pdf
          pdftotext -layout books/pl/functional_analysis_ch27_context_ci.pdf books/pl/functional_analysis_ch27_context_ci.txt
          grep -q 'Bazy Schaudera' books/pl/functional_analysis_ch27_context_ci.txt
          grep -q 'Baza monotoniczna' books/pl/functional_analysis_ch27_context_ci.txt
          grep -q 'Baza bezwarunkowa' books/pl/functional_analysis_ch27_context_ci.txt
      - name: Upload PDF and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-analysis-ch27-pdf
          path: |
            books/pl/functional_analysis_ch27_context_ci.pdf
            books/pl/functional_analysis_ch27_context_ci.log
            books/pl/functional_analysis_ch27_context_ci.txt
          if-no-files-found: warn
