name: Mathematical analysis II validation
on:
  push:
    paths:
      - 'books/pl/mathematical_analysis_ii.tex'
      - 'chapters/pl/mathematical_analysis_ii/**'
      - 'tests/mathematical/mathematical_analysis_ii/**'
      - '.github/workflows/mathematical_analysis_ii.yml'
  pull_request:
    paths:
      - 'books/pl/mathematical_analysis_ii.tex'
      - 'chapters/pl/mathematical_analysis_ii/**'
      - 'tests/mathematical/mathematical_analysis_ii/**'
      - '.github/workflows/mathematical_analysis_ii.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-lang-polish lmodern
      - name: Compile book
        working-directory: books/pl
        run: |
          # At least two passes; allow the table of contents and references to settle.
          for pass in 1 2 3 4 5; do
            pdflatex -interaction=nonstopmode -halt-on-error mathematical_analysis_ii.tex
            if [ "$pass" -ge 2 ] && ! grep -Eq 'Label\(s\) may have changed|Rerun to get cross-references right|Rerun to get outlines right|There were undefined references' mathematical_analysis_ii.log; then
              break
            fi
          done
          if grep -E 'There were undefined references|There were multiply-defined labels|LaTeX Warning: Reference .* undefined|destination with the same identifier|Label\(s\) may have changed|Rerun to get cross-references right|Rerun to get outlines right' mathematical_analysis_ii.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mathematical-analysis-ii
          path: books/pl/mathematical_analysis_ii.pdf
