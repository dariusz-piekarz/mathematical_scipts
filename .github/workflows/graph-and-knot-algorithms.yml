name: Graph and knot theory - algorithms audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/graph_and_knot_theory/**'
      - 'books/pl/graph_and_knot_theory.tex'
      - 'catalog/books.json'
      - 'tools/tests/test_graph_and_knot_bfs_dfs.py'
      - 'tools/tests/test_graph_and_knot_weighted.py'
      - 'tools/tests/test_graph_and_knot_mst.py'
      - 'tools/tests/test_graph_and_knot_flow.py'
      - 'tools/tests/test_graph_and_knot_extremal.py'
      - 'tools/tests/test_graph_and_knot_random.py'
      - 'tools/tests/test_graph_and_knot_expanders.py'
      - 'audits/graph_and_knot_theory/**'
      - '.github/workflows/graph-and-knot-algorithms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive BFS / DFS / DAG / bridges / catalog tests
        run: python3 tools/tests/test_graph_and_knot_bfs_dfs.py
      - name: Independent weighted shortest-path and CH cross-checks
        run: python3 tools/tests/test_graph_and_knot_weighted.py
      - name: Exhaustive MST forest enumerations and DSU checks
        run: python3 tools/tests/test_graph_and_knot_mst.py
      - name: Exact max-flow/min-cut crosschecks for EK, Dinic and FF
        run: python3 tools/tests/test_graph_and_knot_flow.py
      - name: Independent Mantel, Turan, Zykov and Ramsey exhaustive tests
        run: python3 tools/tests/test_graph_and_knot_extremal.py
      - name: Exact G(n,p) moment, threshold and Ramsey tests
        run: python3 tools/tests/test_graph_and_knot_random.py
      - name: Exhaustive expansion, Cheeger, eigenvalues and lazy mixing checks
        run: python3 tools/tests/test_graph_and_knot_expanders.py

  chapter-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Polish LaTeX and TikZ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-lang-polish texlive-pictures lmodern poppler-utils
      - name: Make audited 00-06 plus graph algorithms, probability and expanders PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('books/pl')
          source = (root / 'graph_and_knot_theory.tex').read_text(encoding='utf-8')
          matches = re.findall(r'\\input\{../../chapters/pl/graph_and_knot_theory/[^}]+\}', source)
          assert len(matches) == 44
          marker = matches[0]
          preamble = source.split(marker, 1)[0]
          # Include historical chapter 06 after the algorithmic block:
          # chapter 05 now explicitly refers forward to its incidence algebra.
          chosen = matches[:14]
          assert '06-macierze-incydencji-cykle-i-przekroje' in chosen[-1]
          assert '37-algorytmiczne-przeszukiwanie-grafow-bfs-dfs' in chosen[-8]
          assert '38-najkrotsze-drogi-wazone-i-algorytmy-wyszukiwania-tras' in chosen[-7]
          assert '39-minimalne-drzewa-rozpinajace-prim-kruskal-dsu' in chosen[-6]
          assert '40-algorytmy-przeplywowe-ford-fulkerson-edmonds-karp-dinic' in chosen[-5]
          assert '41-twierdzenia-mantela-turana-i-ramseya' in chosen[-4]
          assert '42-grafy-losowe-i-metoda-probabilistyczna' in chosen[-3]
          assert '43-ekspandery-widmo-laplasjanu-i-spacery-losowe' in chosen[-2]
          text = preamble + '\n'.join(chosen) + '\n\\end{document}\n'
          (root / 'graph_and_knot_algorithms_ci.tex').write_text(text, encoding='utf-8')
          PY
      - name: Compile three times and reject unstable references / layout
        working-directory: books/pl
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error graph_and_knot_algorithms_ci.tex > graph_algorithms_pass1.txt
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error graph_and_knot_algorithms_ci.tex > graph_algorithms_pass2.txt
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error graph_and_knot_algorithms_ci.tex > graph_algorithms_pass3.txt
          test -s graph_and_knot_algorithms_ci.pdf
          for target in 'ch:tg-bfs-dfs' 'thm:tg-bfs-correct' 'thm:tg-dfs-bridge' 'fig:tg-bfs-layers' 'ch:tg-shortest-paths' 'thm:tg-weighted-astar' 'thm:tg-weighted-ch-query' 'fig:tg-weighted-sample' 'ch:tg-mst' 'thm:tg-mst-cut' 'thm:tg-mst-kruskal' 'thm:tg-mst-prim' 'fig:tg-mst-five' 'ch:tg-flow-algorithms' 'thm:tg-flow-certificate' 'thm:tg-flow-ek' 'thm:tg-flow-dinic' 'fig:tg-flow-cut-five' 'ch:tg-extremal-ramsey' 'thm:tg-mantel' 'thm:tg-turan' 'thm:tg-ramsey-finite' 'thm:tg-ramsey-33' 'fig:tg-ramsey-c5' 'ch:tg-random-graphs' 'prop:tg-random-triangle-moments' 'thm:tg-random-triangle-threshold' 'thm:tg-random-connectivity' 'thm:tg-random-ramsey-bound' 'fig:tg-random-realization' 'ch:tg-expanders' 'lem:tg-expander-energy' 'thm:tg-expander-cheeger' 'thm:tg-expander-mixing' 'thm:tg-expander-diameter' 'fig:tg-expander-cycle-cut' 'ch:tg-algebra' 'thm:tg-rank' 'thm:tg-edge-hodge'; do
            grep -Fq "\\newlabel{$target}" graph_and_knot_algorithms_ci.aux
          done
          pdftotext -layout graph_and_knot_algorithms_ci.pdf graph_algorithms_layout.txt
          grep -q 'Przeszukiwanie wszerz' graph_algorithms_layout.txt
          grep -q 'Przeszukiwanie w głąb' graph_algorithms_layout.txt
          grep -q 'Dijkstry' graph_algorithms_layout.txt
          grep -q 'kontrakcji' graph_algorithms_layout.txt
          grep -q 'Kruskal' graph_algorithms_layout.txt
          grep -q 'Prim' graph_algorithms_layout.txt
          grep -q 'Edmonds' graph_algorithms_layout.txt
          grep -q 'Dinic' graph_algorithms_layout.txt
          grep -q 'Mantela' graph_algorithms_layout.txt
          grep -q 'Ramseya' graph_algorithms_layout.txt
          grep -q 'Erd' graph_algorithms_layout.txt
          grep -q 'losowe' graph_algorithms_layout.txt
          grep -q 'Cheegera' graph_algorithms_layout.txt
          grep -q 'Ekspandery' graph_algorithms_layout.txt
          grep -q 'Macierze incydencji' graph_algorithms_layout.txt
          pdfinfo graph_and_knot_algorithms_ci.pdf > graph_algorithms_pdfinfo.txt
          if grep -E 'Overfull \\hbox|Overfull \\vbox' graph_and_knot_algorithms_ci.log; then
            echo "PDF contains a protruding line/box: not stable"
            exit 1
          fi
          if grep -E 'LaTeX Warning:.*(multiply defined|undefined|Label\(s\) may have changed)|There were undefined references' graph_and_knot_algorithms_ci.log; then
            echo "Unstable or unresolved references after three LaTeX passes"
            exit 1
          fi
      - name: Upload actual PDF, logs and extracted text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-and-knot-expanders-pdf
          if-no-files-found: warn
          path: |
            books/pl/graph_and_knot_algorithms_ci.pdf
            books/pl/graph_and_knot_algorithms_ci.log
            books/pl/graph_algorithms_pass*.txt
            books/pl/graph_algorithms_layout.txt
            books/pl/graph_algorithms_pdfinfo.txt
