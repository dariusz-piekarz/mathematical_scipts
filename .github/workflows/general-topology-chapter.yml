name: General topology chapter validation

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/general_topology/**'
      - 'books/pl/general_topology.tex'
      - 'catalog/books.json'
      - 'tools/tests/test_general_topology_integration.py'
      - 'tools/tests/test_general_topology_ch02.py'
      - 'tools/tests/test_general_topology_ch03.py'
      - 'tools/tests/test_general_topology_ch04.py'
      - 'tools/tests/test_general_topology_ch05.py'
      - 'tools/tests/test_general_topology_ch06.py'
      - 'tools/tests/test_general_topology_ch06_subnets.py'
      - 'tools/tests/test_general_topology_ch07.py'
      - 'tools/tests/test_general_topology_ch08.py'
      - 'tools/validate_general_topology_ch08.sh'
      - 'tools/validate_general_topology_ch07.sh'
      - 'tools/validate_general_topology_ch06.sh'
      - 'tools/validate_general_topology_ch05.sh'
      - 'tools/validate_general_topology_ch03.sh'
      - 'tools/validate_general_topology_ch04.sh'
      - 'books/pl/general_topology_ch02.tex'
      - 'books/pl/general_topology_ch03.tex'
      - 'books/pl/general_topology_ch04.tex'
      - 'books/pl/general_topology_ch05.tex'
      - 'books/pl/general_topology_ch06.tex'
      - 'books/pl/general_topology_ch07.tex'
      - 'books/pl/general_topology_ch08.tex'
      - 'audits/general_topology/**'
      - '.github/workflows/general-topology-chapter.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and chapter imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path.cwd()
          books = json.loads((root/'catalog/books.json').read_text(encoding='utf-8'))['books']
          items = [b for b in books if b['id'] == 'general_topology']
          assert len(items) == 1
          book = items[0]
          assert book['entrypoint'] == 'books/pl/general_topology.tex'
          assert book['chapters'] == ['chapters/pl/general_topology/01-przestrzenie-topologiczne.tex', 'chapters/pl/general_topology/02-operacje-topologiczne-na-zbiorach.tex', 'chapters/pl/general_topology/03-odwzorowania-ciagle.tex', 'chapters/pl/general_topology/04-konstrukcje-przestrzeni-topologicznych.tex', 'chapters/pl/general_topology/05-aksjomaty-oddzielania.tex', 'chapters/pl/general_topology/06-zbieznosc-topologiczna.tex', 'chapters/pl/general_topology/07-zwartosc.tex', 'chapters/pl/general_topology/08-spojnosc.tex']
          source = (root/book['entrypoint']).read_text(encoding='utf-8')
          for chapter in book['chapters']:
              assert r'\input{../../' + chapter + '}' in source
          for chapter in book['chapters']:
              assert (root/chapter).is_file()
          print('PASS chapter catalog and imports')
          PY
      - name: Independently test chapter finite models and references
        run: python tools/tests/test_general_topology_integration.py
      - name: Verify Chapter 02 finite topological models
        run: python tools/tests/test_general_topology_ch02.py
      - name: Verify Chapter 03 continuous maps and embeddings
        run: python tools/tests/test_general_topology_ch03.py
      - name: Verify Chapter 04 constructions and quotients
        run: python tools/tests/test_general_topology_ch04.py
      - name: Verify Chapter 05 separation axioms and Tietze extension
        run: python tools/tests/test_general_topology_ch05.py
      - name: Verify Chapter 06 nets, filters and convergence
        run: python tools/tests/test_general_topology_ch06.py
      - name: Independently verify convergent subnets
        run: python tools/tests/test_general_topology_ch06_subnets.py
      - name: Verify Chapter 07 compactness, ultrafilters and Weierstrass
        run: python tools/tests/test_general_topology_ch07.py
      - name: Verify Chapter 08 connectedness and path-connectedness
        run: python tools/tests/test_general_topology_ch08.py
      - name: Build complete book PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 02 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch02.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 03 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch03.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 04 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch04.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 05 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch05.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 06 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch06.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 07 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch07.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Build standalone Chapter 08 PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: general_topology_ch08.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Check PDF and LaTeX log
        run: |
          test -s books/pl/general_topology.pdf
          test -s books/pl/general_topology_ch02.pdf
          test -s books/pl/general_topology_ch03.pdf
          test -s books/pl/general_topology_ch04.pdf
          test -s books/pl/general_topology_ch05.pdf
          test -s books/pl/general_topology_ch06.pdf
          test -s books/pl/general_topology_ch07.pdf
          test -s books/pl/general_topology_ch08.pdf
          for log in books/pl/general_topology.log books/pl/general_topology_ch02.log books/pl/general_topology_ch03.log books/pl/general_topology_ch04.log books/pl/general_topology_ch05.log books/pl/general_topology_ch06.log books/pl/general_topology_ch07.log books/pl/general_topology_ch08.log; do
            if grep -qE 'Overfull|Underfull|Missing character|LaTeX Warning|Undefined control sequence|Fatal error' "$log"; then
              grep -nE 'Overfull|Underfull|Missing character|LaTeX Warning|Undefined control sequence|Fatal error' "$log"
              exit 1
            fi
          done
      - name: Upload compiled chapter PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-topology-ch01-ch08
          path: |
            books/pl/general_topology.pdf
            books/pl/general_topology.log
            books/pl/general_topology_ch02.pdf
            books/pl/general_topology_ch02.log
            books/pl/general_topology_ch03.pdf
            books/pl/general_topology_ch03.log
            books/pl/general_topology_ch04.pdf
            books/pl/general_topology_ch04.log
            books/pl/general_topology_ch05.pdf
            books/pl/general_topology_ch05.log
            books/pl/general_topology_ch06.pdf
            books/pl/general_topology_ch06.log
            books/pl/general_topology_ch07.pdf
            books/pl/general_topology_ch07.log
            books/pl/general_topology_ch08.pdf
            books/pl/general_topology_ch08.log
          if-no-files-found: warn
