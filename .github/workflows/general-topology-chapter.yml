jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate catalog and chapter imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path.cwd()
          books = json.loads((root/'catalog/books.json').read_text(encoding='utf-8'))['books']
          items = [b for b in books if b['id'] == 'general_topology']
          assert len(items) == 1
          book = items[0]
          assert book['entrypoint'] == 'books/pl/general_topology.tex'
          assert book['chapters'] == ['chapters/pl/general_topology/01-przestrzenie-topologiczne.tex', 'chapters/pl/general_topology/02-operacje-topologiczne-na-zbiorach.tex', 'chapters/pl/general_topology/03-odwzorowania-ciagle.tex', 'chapters/pl/general_topology/04-konstrukcje-przestrzeni-topologicznych.tex', 'chapters/pl/general_topology/05-aksjomaty-oddzielania.tex', 'chapters/pl/general_topology/06-zbieznosc-topologiczna.tex', 'chapters/pl/general_topology/07-zwartosc.tex', 'chapters/pl/general_topology/08-spojnosc.tex', 'chapters/pl/general_topology/09-aksjomaty-przeliczalnosci.tex', 'chapters/pl/general_topology/10-metryzowalnosc.tex', 'chapters/pl/general_topology/11-zupelnosc-i-twierdzenie-bairea.tex', 'chapters/pl/general_topology/12-przestrzenie-jednostajne.tex', 'chapters/pl/general_topology/13-zupelnosc-jednostajna-i-uzupelnienia.tex', 'chapters/pl/general_topology/14-zwartosc-lokalna.tex', 'chapters/pl/general_topology/15-parazwartosc-i-podzialy-jednosci.tex', 'chapters/pl/general_topology/16-funkcje-ciagle-i-uzwarcenia.tex', 'chapters/pl/general_topology/17-uzwarcenia-aleksandrowa-i-cecha-stonea.tex', 'chapters/pl/general_topology/18-przestrzenie-odwzorowan-i-topologia-zwarto-otwarta.tex', 'chapters/pl/general_topology/19-przestrzenie-polskie-i-zbiory-borelowskie.tex', 'chapters/pl/general_topology/20-zbiory-analityczne-i-operacja-suslina.tex', 'chapters/pl/general_topology/21-topologie-na-rodzinach-podzbiorow.tex', 'chapters/pl/general_topology/22-zbieznosc-kuratowskiego-wijsman-attouch-wets.tex', 'chapters/pl/general_topology/23-wymiar-topologiczny.tex', 'chapters/pl/general_topology/24-grupy-topologiczne-i-przestrzenie-jednorodne.tex', 'chapters/pl/general_topology/25-continua-i-ich-struktura.tex', 'chapters/pl/general_topology/26-twierdzenie-hahna-mazurkiewicza.tex']
          source = (root/book['entrypoint']).read_text(encoding='utf-8')
          for chapter in book['chapters']:
              assert r'\input{../../' + chapter + '}' in source
          for chapter in book['chapters']:
              assert (root/chapter).is_file()
          print('PASS chapter catalog and imports')
          PY
      - name: Independently test chapter finite models and references
