name: PDE - chapter 13 audit

on:
  push:
    branches:
      - biblioteka-matematyczna-iteracja-6
    paths:
      - 'chapters/pl/partial_differential_equations/**'
      - 'application/backend/figure_preview.py'
      - 'chapters/pl/partial_differential_equations/08-transformata-fouriera-i-dystrybucje-temperowane.tex'
      - 'chapters/pl/partial_differential_equations/09-przestrzenie-sobolewa.tex'
      - 'chapters/pl/partial_differential_equations/10-zanurzenia-i-zwartosc-sobolewa.tex'
      - 'chapters/pl/partial_differential_equations/11-metody-wariacyjne-i-twierdzenie-laxa-milgrama.tex'
      - 'chapters/pl/partial_differential_equations/15-regularnosc-sobolewa-rozwiazan-eliptycznych.tex'
      - 'chapters/pl/functional_analysis/**'
      - 'chapters/pl/partial_differential_equations/07-dystrybucje-i-slabe-pochodne.tex'
      - 'chapters/pl/partial_differential_equations/06-metody-fouriera-i-rozdzielenie-zmiennych.tex'
      - 'chapters/pl/partial_differential_equations/05-rownanie-falowe.tex'
      - 'chapters/pl/partial_differential_equations/04-rownanie-ciepla.tex'
      - 'books/pl/partial_differential_equations.tex'
      - 'catalog/partial_differential_equations_manifest.json'
      - 'latex/pl/code-listings.tex'
      - 'application/config/preambles/PDE.tex'
      - 'tests/mathematical/partial_differential_equations/chapter-13/**'
      - '.github/workflows/partial-differential-equations-ch13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-ch13:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run executable regression checks
        run: python3 tests/mathematical/partial_differential_equations/chapter-13/test_boundary.py -v
      - name: Check references and prepare standalone chapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          chapter = Path("chapters/pl/partial_differential_equations/13-eliptyczne-zagadnienia-brzegowe.tex")
          source = chapter.read_text(encoding="utf-8")
          labels = re.findall(r"\\label\{([^}]+)\}", source)
          refs = re.findall(r"\\(?:eqref|ref)\{([^}]+)\}", source)
          assert len(labels) == len(set(labels)), "Duplicate labels"
          root = Path("chapters/pl/partial_differential_equations")
          dependencies = [p for p in root.glob("*.tex") if p.name[:2] in
                          {"05", "06", "07", "08", "09", "10", "11", "12", "15"}]
          external = {}
          for target in dependencies:
              target_labels = re.findall(r"\\label\{([^}]+)\}", target.read_text(encoding="utf-8"))
              for label in set(refs)-set(labels):
                  if label in target_labels:
                      assert label not in external, f"Ambiguous target: {label}"
                      external[label] = target
          for label, target in external.items():
              assert target.read_text(encoding="utf-8").count(r"\label{" + label + "}") == 1, label
          assert not set(labels) & set(external), "External label collides with local label"
          assert set(refs) <= set(labels) | set(external), f"Missing targets: {set(refs)-set(labels)-set(external)}"
          stack = []
          for kind, env in re.findall(r"\\(begin|end)\{([^}]+)\}", source):
              if kind == "begin":
                  stack.append(env)
              else:
                  assert stack and stack.pop() == env, f"Unmatched end: {env}"
          assert not stack, f"Unclosed environments: {stack}"
          print(f"{len(labels)} distinct labels; {len(refs)} resolved reference occurrences")
          book = Path("books/pl/partial_differential_equations.tex").read_text(encoding="utf-8")
          assert book.count(r"\begin{document}") == 1
          preamble = book.split(r"\begin{document}", 1)[0]
          inputs = re.findall(r"\\input\{\.\./\.\./(chapters/pl/partial_differential_equations/[^}]+)\}", book)
          import json
          manifest = json.loads(Path("catalog/partial_differential_equations_manifest.json").read_text(encoding="utf-8"))
          assert inputs == [row["path"] for row in manifest["chapters"]]
          chapter_number = inputs.index(chapter.as_posix()) + 1
          assert chapter_number == 13
          external_numbers = {label: inputs.index(path.as_posix()) + 1 for label, path in external.items()}
          canonical = Path("latex/pl/code-listings.tex").read_text(encoding="utf-8")
          for name, text in (("book", preamble), ("Atlas", Path("application/config/preambles/PDE.tex").read_text(encoding="utf-8"))):
              assert text.count(canonical) == 1, f"Stale code listings: {name}"
          # All theorem-like environments share the chapter theorem counter.
          assert r"\newtheorem{twierdzenie}{Twierdzenie}[chapter]" in preamble
          environments = ("twierdzenie", "stwierdzenie", "lemat", "wniosek",
                          "definicja", "przyklad", "kontrprzyklad", "uwaga")
          for env in environments[1:]:
              assert r"\newtheorem{" + env + "}[twierdzenie]" in preamble, env
          for label, target in external.items():
              target_source = target.read_text(encoding="utf-8")
              assert len(re.findall(r"\\chapter(?:\[|\{)", target_source)) == 1
              assert not re.search(r"\\(?:setcounter|addtocounter|stepcounter|refstepcounter)\{chapter\}", target_source)
          # Match the shared theorem counter and chapter-reset equation counter.
          assert r"\numberwithin{equation}{chapter}" in preamble
          numbers = {}
          for label, target in external.items():
              number = external_numbers[label]
              raw = target.read_text(encoding="utf-8")
              clean = re.sub(r"(?<!\\)%[^\n]*", "", raw)
              prefix = clean.split(r"\label{" + label + "}", 1)[0]
              if label.startswith("chap:"):
                  numbers[label] = str(number)
                  continue
              assert not re.search(r"\\(?:setcounter|addtocounter|stepcounter|refstepcounter)\{(?:equation|twierdzenie)\}", prefix), label
              if label.startswith(("thm:", "def:", "ex:", "lem:", "cor:", "rem:", "prop:")):
                  starts = re.findall(r"\\begin\{(" + "|".join(environments) + r")\}", prefix)
                  expected = {"thm": "twierdzenie", "def": "definicja", "ex": "przyklad", "lem": "lemat", "cor": "wniosek", "rem": "uwaga", "prop": "stwierdzenie"}[label.split(":")[0]]
                  assert starts and (starts[-1] == expected or (expected == "przyklad" and starts[-1] == "kontrprzyklad")), label
                  numbers[label] = f"{number}.{len(starts)}"
              elif label.startswith("sec:"):
                  assert not re.search(r"\\(?:setcounter|addtocounter|stepcounter|refstepcounter)\{section\}", prefix), label
                  starts = re.findall(r"\\section(?:\[[^\]]*\])?\{", prefix)
                  assert starts, label
                  numbers[label] = f"{number}.{len(starts)}"
              else:
                  raise AssertionError(f"Unsupported external reference {label}")
          # Number-only references: target chapters are absent from isolated PDF.
          external_label = "\n".join([r"\makeatletter"] + [
              r"\@namedef{r@" + label + "}{{" + number + r"}{}{}{}{}}"
              for label, number in numbers.items()
          ] + [r"\makeatother"])
          print(f"Standalone chapter {chapter_number}; external labels (numbers only): {numbers}")
          Path("books/pl/partial_differential_equations_ch13_ci.tex").write_text(
              preamble + "\n" + external_label + "\n"
              + r"\begin{document}" + "\n"
              + r"\setcounter{chapter}{" + str(chapter_number-1) + "}\n"
              + r"\input{../../chapters/pl/partial_differential_equations/13-eliptyczne-zagadnienia-brzegowe.tex}"
              + "\n" + r"\end{document}" + "\n",
              encoding="utf-8",
          )
          PY
      - name: Compile standalone chapter with canonical preamble
        uses: xu-cheng/latex-action@v3
        with:
          root_file: partial_differential_equations_ch13_ci.tex
          working_directory: books/pl
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect diagnostics and render pages
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          stem=books/pl/partial_differential_equations_ch13_ci
          test -s "$stem.pdf"
          test -s "$stem.log"
          pdfinfo "$stem.pdf"
          pdftotext -layout "$stem.pdf" "$stem.txt"
          mkdir -p books/pl/pde_ch13_render
          pdftoppm -r 120 -png "$stem.pdf" books/pl/pde_ch13_render/page
          if grep -E 'Undefined control sequence|There were undefined references|LaTeX Warning: (Reference|Citation).*undefined|Overfull \\hbox|Missing character' "$stem.log"; then
            echo 'Critical LaTeX diagnostics detected.'
            exit 1
          fi
      - name: Upload compiled chapter and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-ch13-audit
          path: |
            books/pl/partial_differential_equations_ch13_ci.pdf
            books/pl/partial_differential_equations_ch13_ci.log
            books/pl/partial_differential_equations_ch13_ci.txt
            books/pl/pde_ch13_render/
          if-no-files-found: warn

  audit-figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install actual TikZ compiler and PNG converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-pictures texlive-lang-polish texlive-fonts-recommended lmodern poppler-utils
      - name: Render all indexed PDE figures with Atlas backend
        run: python3 tests/mathematical/partial_differential_equations/chapter-13/audit_figures.py
      - name: Upload individual rendered images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-atlas-figure-audit
          path: |
            pde-figure-audit/report.json
            pde-figure-audit/*.png
          if-no-files-found: warn
